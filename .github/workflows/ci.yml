name: CI

on:
  push:
  pull_request:

jobs:
  tests:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fizzbuzz
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_ROOT_PASSWORD: root

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10


    steps:

      - uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Run migrations
        env:
          DATABASE_URL: mysql+pymysql://app:app@127.0.0.1:3306/fizzbuzz
        run: |
          alembic upgrade head


      - name: Run tests
        env:
          DATABASE_URL: mysql+pymysql://app:app@127.0.0.1:3306/fizzbuzz
        run: |
          pytest